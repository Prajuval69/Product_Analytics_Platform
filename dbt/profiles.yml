product_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PG_HOST', '127.0.0.1') }}"
      port: "{{ env_var('PG_PORT', '55432') | int }}"
      user: "{{ env_var('PG_USER', 'analytics') }}"
      password: "{{ env_var('PG_PASSWORD', '') }}"
      dbname: "{{ env_var('PG_DATABASE', 'analytics') }}"
      schema: analytics
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 20
