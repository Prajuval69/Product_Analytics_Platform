x-airflow-common: &airflow-common
  build: .
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-db:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/platform/airflow/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    PG_HOST: warehouse
    PG_PORT: '5432'
    PG_DATABASE: analytics
    PG_USER: analytics
    PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    SYNTHETIC_SEED: ${SYNTHETIC_SEED:-42}
    SYNTHETIC_USERS: ${SYNTHETIC_USERS:-10000}
    HISTORY_START: ${HISTORY_START:-2025-01-01}
    HISTORY_END: ${HISTORY_END:-2025-09-30}
    DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    DBT_THREADS: ${DBT_THREADS:-4}
  volumes:
    - ./data:/opt/platform/data
    - ./outputs:/opt/platform/outputs
    - dbt-target:/opt/platform/dbt/target
    - dbt-logs:/opt/platform/dbt/logs
    - airflow-logs:/opt/airflow/logs
  depends_on:
    warehouse:
      condition: service_healthy
    airflow-db:
      condition: service_healthy

services:
  warehouse:
    image: postgres:16.9
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    ports: ['127.0.0.1:55432:5432']
    volumes: [warehouse-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U analytics -d analytics']
      interval: 5s
      timeout: 5s
      retries: 20
  airflow-db:
    image: postgres:16.9
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
    volumes: [airflow-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airflow -d airflow']
      interval: 5s
      timeout: 5s
      retries: 20
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    command: version
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 5
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
  pipeline:
    <<: *airflow-common
    profiles: [tools]
    entrypoint: []
    command: /opt/analytics-venv/bin/python -m platform_app.cli pipeline

volumes:
  warehouse-data:
  airflow-data:
  airflow-logs:
  dbt-target:
  dbt-logs:
