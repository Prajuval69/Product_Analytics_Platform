[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-analytics-platform"
version = "1.0.0"
description = "Reproducible PostgreSQL, dbt, Airflow and churn analytics portfolio"
requires-python = ">=3.11,<3.13"
dependencies = [
  "dbt-core==1.9.10", "dbt-postgres==1.9.0", "psycopg[binary]==3.2.9",
  "pandas==2.2.3", "numpy==2.1.3", "scipy==1.15.3", "scikit-learn==1.6.1",
  "python-dotenv==1.1.0", "PyYAML==6.0.2"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.13"]

[project.scripts]
analytics = "platform_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a completed PostgreSQL pipeline", "airflow: requires real Apache Airflow on Linux"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
